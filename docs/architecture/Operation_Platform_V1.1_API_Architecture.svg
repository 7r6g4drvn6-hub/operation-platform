<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071b33"/><stop offset="1" stop-color="#0b2747"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#42c4dd"/></marker>
    <style><![CDATA[
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#eef6ff}.title{font-size:44px;font-weight:700}.subtitle{font-size:19px;fill:#b9cee5}.layer{fill:#0d3159;stroke:#356b9f;stroke-width:2}.layerTitle{font-size:20px;font-weight:700;fill:#81d8eb;letter-spacing:2px}.box{fill:#fff;stroke:#bdd4e8;stroke-width:2}.api{fill:#e0f8fb;stroke:#40b8d0;stroke-width:2}.signal{fill:#d6edff;stroke:#3d91ca;stroke-width:3}.core{fill:#eaf4ff;stroke:#6e9ed0;stroke-width:2}.store{fill:#eff7fb;stroke:#6ebbc8;stroke-width:2}.boxTitle{font-size:20px;font-weight:700;fill:#123555!important}.boxSub{font-size:15px;fill:#55718c!important}.small{font-size:14px;fill:#335a7d!important}.arrow{stroke:#42c4dd;stroke-width:3;fill:none;marker-end:url(#arrow)}.divider{stroke:#7499bf;stroke-width:1;stroke-dasharray:6 6}.badge{fill:#163f69}.badgeText{font-size:16px;font-weight:700;fill:#9de7f4}
    ]]></style>
  </defs>
  <rect width="2400" height="1800" fill="url(#bg)"/>
  <text x="1200" y="78" text-anchor="middle" class="title">Operation Platform V1.1 API Architecture</text>
  <text x="1200" y="112" text-anchor="middle" class="subtitle">Signal Intelligence Layer for China Region Operations</text>

  <rect x="70" y="150" width="2260" height="230" rx="12" class="layer"/>
  <text x="105" y="184" class="layerTitle">01 · EXTERNAL DATA SOURCES</text>
  <g>
    <rect x="115" y="215" width="320" height="120" rx="8" class="box"/><text x="275" y="260" text-anchor="middle" class="boxTitle" fill="#123555">Vehicle Side</text><text x="275" y="287" text-anchor="middle" class="boxSub" fill="#55718c">Car System · App Feedback</text>
    <rect x="475" y="215" width="320" height="120" rx="8" class="box"/><text x="635" y="260" text-anchor="middle" class="boxTitle" fill="#123555">SMO Ticket System</text><text x="635" y="287" text-anchor="middle" class="boxSub" fill="#55718c">Customer Issues</text>
    <rect x="835" y="215" width="320" height="120" rx="8" class="box"/><text x="995" y="260" text-anchor="middle" class="boxTitle" fill="#123555">Carrier Backend</text><text x="995" y="287" text-anchor="middle" class="boxSub" fill="#55718c">Incident System</text>
    <rect x="1195" y="215" width="320" height="120" rx="8" class="box"/><text x="1355" y="260" text-anchor="middle" class="boxTitle" fill="#123555">Probe Platform</text><text x="1355" y="287" text-anchor="middle" class="boxSub" fill="#55718c">Probe Result</text>
    <rect x="1555" y="215" width="320" height="120" rx="8" class="box"/><text x="1715" y="260" text-anchor="middle" class="boxTitle" fill="#123555">Monitoring System</text><text x="1715" y="287" text-anchor="middle" class="boxSub" fill="#55718c">Availability</text>
    <rect x="1915" y="215" width="320" height="120" rx="8" class="box"/><text x="2075" y="260" text-anchor="middle" class="boxTitle" fill="#123555">Release / CR System</text><text x="2075" y="287" text-anchor="middle" class="boxSub" fill="#55718c">Deployment Events</text>
  </g>
  <path d="M275 335V430H1200" class="arrow"/><path d="M635 335V430H1200" class="arrow"/><path d="M995 335V430H1200" class="arrow"/><path d="M1355 335V430H1200" class="arrow"/><path d="M1715 335V430H1200" class="arrow"/><path d="M2075 335V430H1200" class="arrow"/>

  <rect x="70" y="420" width="2260" height="180" rx="12" class="layer"/>
  <text x="105" y="455" class="layerTitle">02 · INTEGRATION API LAYER</text>
  <rect x="470" y="475" width="1460" height="78" rx="10" class="api"/><text x="1200" y="507" text-anchor="middle" class="boxTitle" fill="#123555">Operation Platform API Gateway</text><text x="1200" y="533" text-anchor="middle" class="small" fill="#335a7d">POST /api/integration/probe/result · incident · smo-ticket · availability · release</text>
  <path d="M1200 553V650" class="arrow"/>

  <rect x="70" y="630" width="2260" height="200" rx="12" class="layer"/>
  <text x="105" y="666" class="layerTitle">03 · ADAPTER LAYER</text>
  <g>
    <rect x="225" y="710" width="330" height="75" rx="8" class="box"/><text x="390" y="756" text-anchor="middle" class="boxTitle" fill="#123555">Probe Adapter</text>
    <rect x="605" y="710" width="330" height="75" rx="8" class="box"/><text x="770" y="756" text-anchor="middle" class="boxTitle" fill="#123555">Incident Adapter</text>
    <rect x="985" y="710" width="330" height="75" rx="8" class="box"/><text x="1150" y="756" text-anchor="middle" class="boxTitle" fill="#123555">SMO Adapter</text>
    <rect x="1365" y="710" width="330" height="75" rx="8" class="box"/><text x="1530" y="756" text-anchor="middle" class="boxTitle" fill="#123555">Availability Adapter</text>
    <rect x="1745" y="710" width="330" height="75" rx="8" class="box"/><text x="1910" y="756" text-anchor="middle" class="boxTitle" fill="#123555">Release Adapter</text>
  </g>
  <text x="1200" y="815" text-anchor="middle" class="subtitle">Raw data → Normalize → Validate → Convert to unified Signal</text>
  <path d="M1200 830V890" class="arrow"/>

  <rect x="70" y="870" width="2260" height="300" rx="12" class="layer"/>
  <text x="105" y="906" class="layerTitle">04 · SIGNAL INTELLIGENCE LAYER</text>
  <rect x="860" y="945" width="680" height="120" rx="10" class="signal"/><text x="1200" y="992" text-anchor="middle" class="boxTitle" fill="#123555">Signal Service</text><text x="1200" y="1023" text-anchor="middle" class="boxSub" fill="#55718c">Unified entry object for all source events</text>
  <rect x="150" y="1085" width="350" height="52" rx="7" class="badge"/><text x="325" y="1118" text-anchor="middle" class="badgeText">Signal Repository</text>
  <rect x="565" y="1085" width="350" height="52" rx="7" class="badge"/><text x="740" y="1118" text-anchor="middle" class="badgeText">Signal Normalization</text>
  <rect x="980" y="1085" width="350" height="52" rx="7" class="badge"/><text x="1155" y="1118" text-anchor="middle" class="badgeText">Risk Calculation</text>
  <rect x="1395" y="1085" width="350" height="52" rx="7" class="badge"/><text x="1570" y="1118" text-anchor="middle" class="badgeText">Correlation Engine</text>
  <rect x="1810" y="1085" width="350" height="52" rx="7" class="badge"/><text x="1985" y="1118" text-anchor="middle" class="badgeText">Rule Engine</text>
  <path d="M1200 1065V1085" class="arrow"/><path d="M1200 1170V1230" class="arrow"/>

  <rect x="70" y="1210" width="2260" height="275" rx="12" class="layer"/>
  <text x="105" y="1246" class="layerTitle">05 · OPERATION PLATFORM CORE</text>
  <g>
    <rect x="130" y="1310" width="275" height="95" rx="8" class="core"/><text x="267" y="1350" text-anchor="middle" class="boxTitle" fill="#123555">Problem</text><text x="267" y="1375" text-anchor="middle" class="boxSub" fill="#55718c">Management</text>
    <rect x="445" y="1310" width="275" height="95" rx="8" class="core"/><text x="582" y="1350" text-anchor="middle" class="boxTitle" fill="#123555">Operation</text><text x="582" y="1375" text-anchor="middle" class="boxSub" fill="#55718c">Management</text>
    <rect x="760" y="1310" width="275" height="95" rx="8" class="core"/><text x="897" y="1350" text-anchor="middle" class="boxTitle" fill="#123555">Action</text><text x="897" y="1375" text-anchor="middle" class="boxSub" fill="#55718c">Management</text>
    <rect x="1075" y="1310" width="275" height="95" rx="8" class="core"/><text x="1212" y="1350" text-anchor="middle" class="boxTitle" fill="#123555">Evidence</text><text x="1212" y="1375" text-anchor="middle" class="boxSub" fill="#55718c">Management</text>
    <rect x="1390" y="1310" width="275" height="95" rx="8" class="core"/><text x="1527" y="1350" text-anchor="middle" class="boxTitle" fill="#123555">Verification</text><text x="1527" y="1375" text-anchor="middle" class="boxSub" fill="#55718c">Expected vs Actual</text>
    <rect x="1705" y="1310" width="275" height="95" rx="8" class="core"/><text x="1842" y="1350" text-anchor="middle" class="boxTitle" fill="#123555">Outcome + History</text><text x="1842" y="1375" text-anchor="middle" class="boxSub" fill="#55718c">Closed loop</text>
  </g>
  <path d="M405 1357H445M720 1357H760M1035 1357H1075M1350 1357H1390M1665 1357H1705" class="arrow"/>
  <path d="M1200 1485V1540" class="arrow"/>

  <rect x="70" y="1520" width="2260" height="190" rx="12" class="layer"/>
  <text x="105" y="1556" class="layerTitle">06 · STORAGE LAYER</text>
  <g>
    <rect x="260" y="1600" width="360" height="64" rx="28" class="store"/><text x="440" y="1640" text-anchor="middle" class="boxTitle" fill="#123555">◉ Signal Store</text>
    <rect x="720" y="1600" width="360" height="64" rx="28" class="store"/><text x="900" y="1640" text-anchor="middle" class="boxTitle" fill="#123555">◉ Problem Store</text>
    <rect x="1180" y="1600" width="360" height="64" rx="28" class="store"/><text x="1360" y="1640" text-anchor="middle" class="boxTitle" fill="#123555">◉ Operation Store</text>
    <rect x="1640" y="1600" width="360" height="64" rx="28" class="store"/><text x="1820" y="1640" text-anchor="middle" class="boxTitle" fill="#123555">◉ Evidence Store</text>
  </g>
  <text x="1200" y="1760" text-anchor="middle" class="subtitle">Unified Signal is the upstream entry point; Problem → Operation remains the existing evidence-driven closed loop.</text>
</svg>
